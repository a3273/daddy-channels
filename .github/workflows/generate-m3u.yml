name: Generate DaddyLive M3U Playlist

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'channels.json'
      - 'providers/**'
      - 'generate_m3u.py'
      - '.github/workflows/generate-m3u.yml'

permissions:
  contents: write

jobs:
  generate-playlist:
    name: Genera Playlist M3U
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate M3U playlist
        run: |
          echo "=== Avvio generazione playlist ==="
          python generate_m3u.py
          echo "=== Generazione completata ==="

      - name: Show generation summary
        run: |
          if [ -f status.json ]; then
            echo "📊 Riepilogo generazione:"
            python -c "
          import json
          with open('status.json') as f:
              data = json.load(f)
          s = data.get('summary', {})
          print(f\"  Canali totali: {s.get('channels_total', 0)}\")
          print(f\"  Canali abilitati: {s.get('channels_enabled', 0)}\")
          print(f\"  Stream generati: {s.get('streams_generated', 0)}\")
          print(f\"  Stream falliti: {s.get('streams_failed', 0)}\")
          "
          fi

      - name: Verify generated files
        run: |
          ls -lh playlist.m3u status.json 2>/dev/null || echo "⚠️ File mancanti"
          head -n 10 playlist.m3u 2>/dev/null || true

      - name: Commit and push changes
        run: |
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add playlist.m3u status.json edge.json 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "✅ Nessuna modifica"
          else
            git commit -m "🔄 Update DaddyLive playlist [skip ci]"
            git push
          fi
