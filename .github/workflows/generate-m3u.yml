
### 4️⃣ **.github/workflows/generate-m3u.yml** (da verificare/aggiornare)

```yaml
name: Generate M3U Playlist

on:
  schedule:
    # Esegui ogni 6 ore
    - cron: '0 */6 * * *'
  workflow_dispatch:  # Permetti esecuzione manuale
  push:
    branches:
      - main
    paths:
      - 'channels.json'
      - 'providers/**'
      - 'generate_m3u.py'

jobs:
  generate:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests
      
      - name: Generate M3U playlist
        run: python generate_m3u.py
      
      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add playlist.m3u status.json edge.json
          git diff --staged --quiet || git commit -m "Update playlist [skip ci]"
          git push
